name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that's still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres just for this job, like `docker compose` locally.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cartly
          POSTGRES_PASSWORD: cartly
          POSTGRES_DB: cartly
        ports:
          - 5432:5432
        # Wait until the database accepts connections before running steps.
        options: >-
          --health-cmd "pg_isready -U cartly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # .env.local is not in git, so CI gets its variables here.
    # None of these are real secrets: the tests never call Stripe or log in.
    env:
      DATABASE_URL: postgres://cartly:cartly@localhost:5432/cartly
      SITE_URL: http://localhost:3100
      ADMIN_PASSWORD: ci-admin-password
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run db:migrate
      - run: npm run db:seed

      - run: npm run test:e2e

      # On failure, keep the HTML report (screenshots, traces) for 7 days.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
